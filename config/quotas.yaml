# Quotas et plafonds. Passage en fonctionnement CONTINU le 2026-09-25
# (demande explicite de Mathéo : "il ne faut jamais qu'il s'arrête") — le
# radar tourne désormais sur un Background Worker Render (pas un Cron Job,
# qui a un plafond dur de 12h/exécution imposé par Render lui-même et n'est
# pas fait pour tourner en continu). Un seul "run" couvre toute une journée
# UTC ; à l'intérieur, plusieurs PASSAGES s'enchaînent (collecte + Scout,
# puis Analyst/Critic sur tout le retard en attente — jamais un dossier
# abandonné à mi-chemin, voir app/pipeline/orchestrator.py::_selectionner_pour_analyse
# qui reprend systématiquement le retard des passages précédents).
#
# En pratique, le budget réel dépensé sera probablement bien en dessous du
# plafond la plupart des jours : les vérifications de qualité (filtre de
# preuves, Critic) et le volume réel de signaux disponibles limitent le
# nombre de dossiers avant que l'argent ne soit le vrai frein — c'est voulu
# (§1 du cahier des charges : la qualité prime sur le volume). Ce ne sont
# pas des estimations de prix fournisseur.

budget_eur_par_jour: 25.0

# Second garde-fou, ajouté en sous-étape 0.7 (AMELIORATIONS.md), INDÉPENDANT
# de toute estimation de prix : un plafond dur sur le nombre d'appels/jour au
# modèle approfondi (Analyst + Critic — le Scout, moins cher, n'est jamais
# compté ici). Le premier des deux plafonds (celui-ci ou budget_eur_par_jour)
# atteint arrête les appels.
#
# Calibré sur les chiffres réels du 25/09/2026
# (rapports/DIAGNOSTIC_BUDGET_2026-09-25.md, §3) : 1037 appels
# Analyst+Critic ce jour-là, pour ≈30,59 € au TARIF ALORS UTILISÉ PAR LE CODE
# (Sonnet 5 à 3 $/15 $, conversion à 0,92). Recalculé aux tarifs officiels
# vérifiés (voir config/tarifs.yaml, sous-étape 0.7 point 6 : Sonnet 5 à
# 2 $/10 $, soit ×2/3, et conversion à 0,877, soit ×0,877/0,92) : ≈30,59 € ×
# (2/3) × (0,877/0,92) ≈ 19,44 €, soit ≈0,0187 €/appel approfondi. 25 € /
# 0,0187 € ≈ 1334 appels — arrondi à la baisse par prudence (ce calcul reste
# une extrapolation à partir d'UNE seule journée, pas une moyenne stable).
max_appels_approfondis_par_jour: 1300

# Taille d'UN passage (pas un plafond définitif : le retard non traité est
# repris automatiquement au passage suivant).
max_signaux_par_passage: 40

# Sous-étape 1.2 (AMELIORATIONS.md) : quota INDÉPENDANT de celui ci-dessus.
# Un item `offre` ne coûte jamais d'appel modèle (il est seulement stocké
# comme preuve de concurrence, jamais transformé en opportunité — voir
# app/pipeline/orchestrator.py::_phase_collecte_et_scout) et ne doit donc
# jamais réduire la place disponible pour les flux `douleur`, qui eux
# alimentent le Scout. Même ordre de grandeur que max_signaux_par_passage :
# rien ne justifie de le limiter plus fort, puisqu'il ne coûte rien.
max_signaux_offre_par_passage: 40

max_analyses_par_passage: 15
max_critiques_par_passage: 15
duree_max_minutes: 60  # plafond de sécurité d'UN SEUL passage (pas de la journée)

# Recherche Reddit sub × expression (sous-étape 1.2) : le produit dépasse
# 200 flux (13 subs `douleur` de app/sources.yaml × 25 expressions de
# app/lexique_douleur.yaml ≈ 325) — voir
# app/pipeline/planificateur_recherche.py pour la rotation.
intervalle_heures_recherche_reddit: 6  # un flux n'est jamais revisité avant ce délai
# Sous-étape 3.10 (AMELIORATIONS.md) : 15 -> 8. L'audit du 26/09/2026
# (rapports/AUDIT_NUIT_2026-09-26.md, §7) a mesuré un taux de 429 de 63,6 %
# toutes voies Reddit confondues ce jour-là -- moins de combinaisons par
# passage, combiné à l'espacement porté à 12 s (app/adapters/http.py) et au
# disjoncteur par passage (app/pipeline/orchestrator.py::_collecter),
# réduit la pression sur Reddit. Une combinaison est donc revisitée un peu
# moins souvent qu'avant à volume de passages égal -- accepté : la qualité
# des réponses (moins de 429) prime sur la fraîcheur de rotation ici.
max_flux_recherche_par_passage: 8  # combinaisons (sub, expression) interrogées par passage
budget_appels_recherche_reddit_par_flux: 5  # résultats gardés par combinaison interrogée

# Recherche Hacker News tag × expression (sous-étape 1.4, connecteur créé en
# 1.3) : même planificateur générique que Reddit ci-dessus
# (app/pipeline/planificateur_recherche.py), quotas séparés parce que le
# volume est bien plus petit (2 tags `comment`/`ask_hn` × 25 expressions =
# 50 combinaisons, contre 325 pour Reddit) — tout tient en un seul passage
# tous les intervalle_heures_recherche_hn.
intervalle_heures_recherche_hn: 6
max_flux_recherche_par_passage_hn: 10
budget_appels_recherche_hn_par_flux: 5

# Rythme entre deux passages, pour ne jamais marteler des sources qui n'ont
# pas changé.
pause_apres_passage_vide_minutes: 10
pause_apres_passage_actif_secondes: 30

# Part des candidats REJETÉS par le filtre de preuves qu'on envoie quand même
# à l'Analyst/Critic, pour détecter un filtre trop sévère (§2, pipeline).
echantillon_rejetes_pour_controle: 0.10

# Réessais réseau : plafonnés, avec délai croissant, sur 429/5xx.
retry_max_tentatives: 3
retry_delai_base_secondes: 2

# L'Enquêteur (sous-étape 3.1, deux compteurs journaliers indépendants du
# budget en euros (fournisseurs gratuits en V1, sous-étape 3.2), chacun avec
# son propre plafond dur (app/pipeline/budget.py::BudgetTracker) -- branchés
# dans le pipeline réel depuis la sous-étape 3.4
# (app/pipeline/orchestrator.py::_phase_enquete).
#
# Relevés à la sous-étape 3.6 (600->1500, 400->1000) : par dossier enquêté,
# jusqu'à 33 requêtes de recherche (5 de base -- 2 "demande" + 3 "concurrence"
# -- × jusqu'à 3 fournisseurs facturés à ce compteur depuis que le magasin
# interne en est exclu ci-dessous, + jusqu'à 18 de plus si 3 concurrents sont
# identifiés, sous-étape 3.4b) et jusqu'à 16 fetchs (8 + 8 phase prix)
# peuvent être engagés -- les anciennes valeurs (600/400) auraient été
# épuisées après ~20-25 dossiers enquêtés dans une même journée UTC, bien en
# dessous des ~650 dossiers/jour que le plafond de 1300 appels approfondis
# (ci-dessus) autorise en théorie. Valeurs de départ du plan (AMELIORATIONS.md,
# 600/400) puis de cette révision (1500/1000) : ni l'une ni l'autre n'a encore
# été mesurée en conditions réelles -- à recalibrer à 48 h (mesure de la
# sous-étape 3.6).
#
# Relevées à nouveau à la sous-étape 3.9 (1500->3000, 1000->1500), suite à
# l'audit réel du 26/09/2026 (rapports/AUDIT_NUIT_2026-09-26.md) : le
# fournisseur Reddit de l'Enquêteur a, à lui seul, épuisé 100 % du plafond de
# requêtes de recherche (750/1500) avant midi UTC pour ZÉRO preuve utilisable
# (robots.txt de Reddit interdit tout crawl -- voir
# FOURNISSEURS_EXTRAIT_DIRECT, app/enqueteur/fetch.py), tandis que le plafond
# de fetchs de page (405/1000, 40,5 %) et le budget en euros (69,8 %) avaient
# encore de la marge à la même heure -- le premier mur touché n'était pas le
# bon. Avec le plafonnement de Reddit à `part_max_reddit_requetes_recherche`
# ci-dessous ET l'extrait de recherche stocké directement (jamais de fetch de
# page Reddit, donc son ancienne pression sur `max_fetchs_pages_par_jour`
# disparaît), le plafond de fetchs pourrait rester stable -- relevé quand
# même par prudence (marge pour Algolia HN, qui "tolère bien plus" que Reddit
# d'après le même audit, §7). Toujours pas mesuré en conditions réelles --
# à recalibrer à 48 h (mesure de la sous-étape 3.9).
max_requetes_recherche_par_jour: 3000
max_fetchs_pages_par_jour: 1500

# Sous-étape 3.9 (AMELIORATIONS.md) : part MAXIMALE du plafond ci-dessus que
# le fournisseur Reddit de l'Enquêteur (app.enqueteur.fournisseurs_gratuits.FournisseurReddit)
# peut consommer -- indépendant du fournisseur Algolia HN, qui n'a lui aucun
# plafond dédié (rien ne justifie de le limiter : 100 % de succès mesuré à
# l'audit du 26/09/2026, contre 63,1 % de 429 pour Reddit à la même heure).
# Contourné explicitement pour la famille de requêtes `prix`, dès qu'un
# concurrent est identifié (`app.enqueteur.enqueteur._enqueter_prix`,
# `budget.verifier_et_engager_requete_recherche(..., prioritaire=True)`) --
# jamais pour le plafond global `max_requetes_recherche_par_jour` ci-dessus,
# qui reste absolu (§4 du cahier des charges, « jamais dépassé »).
part_max_reddit_requetes_recherche: 0.30

# Fetch + extraction des pages retenues par l'Enquêteur (sous-étape 3.3) :
# précautions par page, indépendantes des compteurs journaliers posés en 3.1
# (app/pipeline/budget.py::BudgetTracker, branchés ici depuis la sous-étape
# 3.4). Valeurs de départ du plan, non mesurées en conditions réelles — à
# confirmer/ajuster à la sous-étape 3.6 comme les autres valeurs de départ de
# l'Enquêteur.
max_resultats_enquete_par_opportunite: 8  # "max 8 par opportunité" (texte du plan)
enqueteur_fetch_timeout_secondes: 8  # "timeout court" : plus serré que les 10s de get_with_retry
enqueteur_fetch_taille_max_octets: 2000000  # 2 Mo : au-delà, page jamais stockée (voir app/adapters/http.py::get_avec_limite_taille)
enqueteur_fetch_delai_secondes: 1.0  # entre deux fetchs consécutifs d'un même tour d'enquête

# Fournisseur "magasin interne" de l'Enquêteur (sous-étape 3.2) : similarité
# lexicale (app/pipeline/dedupe.py::similarite_lexicale, même mesure que le
# dédoublonnage) entre la requête générée et les items `signal_concurrence`
# déjà stockés (sous-étape 1.1), sans aucune requête réseau. Seuil plus bas
# que celui du dédoublonnage (SEUIL_REVUE=0.55, app/pipeline/dedupe.py) : on
# y compare deux textes de longueur comparable (deux descriptions
# d'opportunité), alors qu'ici la requête est courte (générée par
# app/enqueteur/gabarits.py) et le candidat un extrait de signal plus long —
# le cosinus sur sacs de mots baisse mécaniquement avec l'asymétrie de
# longueur. Point de départ prudent, non mesuré en conditions réelles — à
# confirmer/ajuster à la sous-étape 3.6.
seuil_similarite_magasin_interne: 0.15

# Branchement de l'Enquêteur dans le pipeline (sous-étape 3.4) : nombre de
# résultats demandés à CHAQUE fournisseur actif pour CHAQUE requête générée
# par app/enqueteur/gabarits.py (avant la sélection finale, plafonnée par
# max_resultats_enquete_par_opportunite ci-dessus). Valeur de départ du plan,
# non mesurée en conditions réelles — à confirmer/ajuster à la sous-étape 3.6
# comme les autres valeurs de départ de l'Enquêteur.
enqueteur_resultats_par_requete: 5
