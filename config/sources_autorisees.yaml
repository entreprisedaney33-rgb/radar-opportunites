# Sources que le Scout a le droit d'interroger.
#
# Les flux RSS réels ont déménagé dans app/sources.yaml en sous-étape 1.1
# (chaque flux y est typé douleur/offre, avec secteur par défaut et langue —
# voir app/sources.py::charger_sources). Ce fichier-ci ne garde que les
# adaptateurs qui n'ont pas cette notion de type : démonstration et Apify.

demo:
  - id: demo_fixtures
    nom: "Données de démonstration (étiquetées DEMO)"
    type: demo
    budget_appels_par_nuit: 999

apify:
  actif: false  # activé seulement si APIFY_TOKEN + APIFY_ACTOR_ID + plafond sont configurés
  plafond_eur_par_execution: null
