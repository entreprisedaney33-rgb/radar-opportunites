# V2.1 (RADAR-V2.md) : lexique de tâches automatisables par l'IA, en français.
# Lu et validé strictement par app/referentiels.py. Servira à l'Étiqueteur (V2.4) :
# étage code (mots-clés ci-dessous) puis étage modèle avec citation vérifiée.
#
# Une entrée : id (identifiant stable, minuscules et tirets bas), libelle, famille,
# donnees_sensibles_patients (facultatif, faux par défaut : vrai si la tâche manipule des données de
# patients, voir la règle ci-dessous) ; mots_cles (expressions et variantes ; la comparaison se fera sans accents ni casse ;
# aucune expression ne doit figurer dans deux tâches, pour ne jamais compter une offre deux fois).
familles:
  - relation_client
  - comptabilite_finance
  - administratif
  - commercial_marketing
  - exploitation
  - ressources_humaines
  - conformite
  - communication

# Décision de Mathéo (2026-10-01) : la santé libérale est un secteur retenu ; l'exclusion HDS
# (hébergement de données de santé, Code de la santé publique, art. L1111-8) porte sur les TÂCHES
# qui manipulent des données de patients. Règle appliquée au chargement : pour les secteurs ci-dessous,
# toute tâche portant `donnees_sensibles_patients: true` est exclue avec le motif « HDS ».
# Hors règle : activités sans donnée de santé humaine (vétérinaires, appareillage, optique).
regle_donnees_sensibles_patients:
  motif: HDS
  source: "Code de la santé publique, art. L1111-8 : tout hébergement de données de santé exige une certification HDS (barrière réglementaire lourde)."
  familles_secteurs: [sante_liberale]
  secteurs_hors_regle: ["75.00Z", "47.74Z", "47.78A"]

