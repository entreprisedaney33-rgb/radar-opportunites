#       hébergement, tourisme, nautisme et plaisance, viticulture, santé libérale hors tâches HDS, services aux entreprises) : traités par la
#       cartographie initiale (RADAR_CARTOGRAPHIE_INITIALE=1, enveloppe RADAR_ENVELOPPE_INITIALE_EUR).
#   2 = les autres secteurs de ces mêmes familles ; 3 = les autres familles. Couverts ensuite par le régime quotidien, dans l'ordre
#       1 -> 2 -> 3, à 2 €/jour au plus (config/cycle_v2.yaml). Modifiable ici : jamais en dur dans le code.
