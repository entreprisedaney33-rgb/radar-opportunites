# V2.1 (RADAR-V2.md) : secteurs où dominent les TPE/PME de 1 à 20 salariés.
# Lu et validé strictement par app/referentiels.py. Jamais un modèle ne modifie ce fichier.
#
# Nomenclature : NAF rév. 2 (2008), celle que renvoie aujourd'hui l'API Recherche
# d'entreprises. ATTENTION : la NAF rév. 2.1 (nouveau code APE) s'applique à partir du
# 1er janvier 2027 (voir config/declencheurs.yaml, « nouveau_code_ape_2027 ») : une table
# de correspondance rév. 2 → 2.1 est planifiée en V2.10 (avant le 1er janvier 2027) ; la colonne
# `naf_version` sera portée par les tables de V2.2 (décision du 2026-10-01).
#
# Une entrée : code (format 00.00A), libelle, famille, priorite (1, 2 ou 3 : ordre de couverture, voir ci-dessous), et éventuellement `exclusion`
# {motif, source}. `source` est une clé de `sources_exclusion` ci-dessous. Une entrée
# exclue reste dans le référentiel (jamais supprimée) : elle sort du radar avec son motif.
nomenclature: "NAF rév. 2 (2008)"
naf_version: "2"   # valeurs : "2" (rév. 2, 2008) ou "2.1" (nouveau code APE, 1er janvier 2027). Voir V2.2 et V2.10 de RADAR-V2.md.
cree_le: "2026-10-01"

familles:
  - batiment
  - sante_liberale
  - droit_chiffre_conseil
  - immobilier
  - commerce_detail
  - restauration_hebergement
  - services_entreprises
  - numerique_creatif
  - transport_leger
  - agriculture_viticulture
  - tourisme_loisirs
  - nautisme
  - services_personne
  - formation
  - automobile
  - artisanat_production

motifs_exclusion:
  - reglementaire_lourd
  - materiel_industriel
  - code_naf_agence

sources_exclusion:
  agence_interim: "Code NAF de l'agence, pas du métier proposé (décision de Mathéo du 2026-10-01) : une offre d'intérim ou de placement porte le code NAF de l'AGENCE qui la publie, pas celui du secteur où le poste sera réellement occupé ; ces offres (162 000 sur 256 000 mesurées le 2026-10-01 : 78.20Z 115 507, 78.10Z 46 300) ne disent donc rien de la demande d'un secteur. Les offres de ces deux codes ne sont ni collectées ni étiquetées."
  pharmacie: "Code de la santé publique, art. L4211-1 : monopole pharmaceutique et données de santé (barrière réglementaire lourde)."
  securite_privee: "Code de la sécurité intérieure, livre VI : autorisation d'exercer et agrément CNAPS obligatoires (barrière réglementaire lourde)."
  funeraire: "Code général des collectivités territoriales, art. L2223-23 : habilitation préfectorale obligatoire (barrière réglementaire lourde)."
  petite_enfance: "Code de l'action sociale et des familles : autorisation ou agrément PMI pour l'accueil de jeunes enfants (barrière réglementaire lourde)."
  engins: "Matériel lourd (engins de terrassement) : investissement au-delà de 20 k€, seuil de config/faisabilite.yaml (4.1, décision du 29/09/2026)."
  chantier_naval: "Construction navale : outillage et locaux industriels, investissement au-delà de 20 k€ (seuil de config/faisabilite.yaml, 4.1)."
  industrie_lourde: "Imprimerie, scierie, transformation de viande : machines industrielles, investissement au-delà de 20 k€ (seuil de config/faisabilite.yaml, 4.1)."

