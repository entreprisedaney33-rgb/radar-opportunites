# V2.1 (RADAR-V2.md) : obligations et échéances touchant les TPE/PME, autour de la
# fenêtre « 18 prochains mois » (construit le 2026-10-01 ; fenêtre : octobre 2026 → avril 2028).
# Lu et validé strictement par app/referentiels.py. JAMAIS inventé : une ligne sans URL
# officielle n'entre pas (le chargeur la refuse). Domaines acceptés : *.gouv.fr, *.europa.eu,
# urssaf.fr.
#
# Champs :
#   date            : date d'entrée en vigueur ou d'échéance (AAAA-MM-JJ).
#   precision_date  : `ferme` (date publiée par la source) ou `a_confirmer` (date à recontrôler :
#                     report possible, date de transposition nationale non publiée…).
#   secteurs        : codes NAF de config/secteurs_tpe.yaml, ou ["*"] pour « tous secteurs ».
#   taches          : identifiants de config/taches.yaml que l'obligation touche DIRECTEMENT (V2.5). Sans ce rattachement, une
#                     obligation générale (la facturation électronique vise tous les secteurs) donnerait les mêmes points à tous
#                     les couples secteur x tâche. Vide ou absent = toutes les tâches. RATTACHEMENT ÉDITORIAL du 2026-10-01
#                     (jugement de Claude, à relire par Mathéo / Fable) : il décide de ce que le critère « déclencheur » récompense.
#   source_url      : page officielle.
#   verifie_le      : date du contrôle.
#   verification    : `page_lue` (la page officielle a été lue en entier le jour du contrôle) ou
#                     `extrait_de_recherche` (date lue dans l'extrait d'un résultat de recherche
#                     provenant du site officiel ; la lecture directe de la page a échoué ce jour-là,
#                     le site coupant la connexion). Les lignes `extrait_de_recherche` doivent être
#                     relues en session avant d'être citées à un client (rafraîchissement V2.10).
rafraichi_le: "2026-10-01"

# Statut du rattachement `taches` ci-dessous : ACCEPTÉ PROVISOIREMENT par Mathéo le 2026-10-01 (jugement éditorial de Claude), « à relire à V2.9
# sur fiches réelles ». Tant que le statut est `provisoire`, toute fiche dont le critère « déclencheur » rapporte des points porte un
# avertissement en base et le dit.
rattachement_taches:
  statut: provisoire
  decide_le: "2026-10-01"
  a_relire_a: "V2.9"
  note: "Rattachement des 21 obligations aux tâches qu'elles touchent : accepté provisoirement, à relire sur fiches réelles."

