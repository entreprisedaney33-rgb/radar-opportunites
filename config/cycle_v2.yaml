# V2.8 (RADAR-V2.md) : cycle du worker (`python -m app.cli run-forever`). Lu par app/config.py::cycle_v2(). Aucun secret ici.
#
# Décision de Mathéo du 2026-10-01 : le worker exécute DÉSORMAIS le cycle v2 et plus jamais le pipeline v1. Le pipeline v1 n'est pas
# supprimé : il est désactivé par ce fichier (`pipeline_v1_actif: false`). Le remettre à `true` rétablit l'ancien comportement du worker.
pipeline_v1_actif: false

# --- Régime quotidien (après la cartographie initiale, ou si elle n'est pas demandée) -------------------------------------
# Plafond de dépense modèle par jour UTC (étiquetage + fiches, tous runs confondus) : celui de config/etiquetage.yaml::budget_eur_par_jour
# (2 €), appliqué par BudgetTracker. Les fiches (déjà calculables à partir des agrégats existants) passent AVANT l'étiquetage du jour, dans
# une part du plafond : sinon l'étiquetage des secteurs de priorité 1 puis 2 absorberait tout le budget et aucune fiche ne serait recalculée.
part_fiches_du_plafond_jour: 0.4
# Si une passe quotidienne laisse du travail (plafond de requêtes d'une API atteint, API en erreur) sans avoir atteint le plafond de
# dépense : nouvelle passe après ce délai. Quand tout est fait ou que le plafond du jour est atteint : attente de minuit UTC.
attente_si_reste_minutes: 30
attente_apres_erreur_minutes: 60
attente_pause_secondes: 60

# --- Cartographie initiale (RADAR_CARTOGRAPHIE_INITIALE=1) ---------------------------------------------------------------
# Traite UNIQUEMENT les secteurs de cette priorité (config/secteurs_tpe.yaml::priorite), dans l'enveloppe unique
# RADAR_ENVELOPPE_INITIALE_EUR (10 € décidés ; étiquetage + fiches). Reprenable et idempotente : chaque étape saute ce qui est fait.
# Terminée quand tout est fait pour cette priorité OU que l'enveloppe est épuisée ; le régime quotidien couvre ensuite le reste.
initiale:
  priorite: 1
  # Part de l'enveloppe que l'étiquetage ne dépasse pas : le reste est gardé pour les fiches (mesure du 2026-10-01 : une fiche ~0,06 €).
  part_etiquetage_de_l_enveloppe: 0.75
  # Garde-fou : nombre maximal de passes d'une même cartographie initiale (une passe = collecte, établissements, étiquetage, agrégation,
  # fiches) avant de la déclarer terminée avec un avertissement.
  passes_max: 40
  attente_entre_passes_minutes: 5

# --- Établissements (V2.8b, 2026-10-02) ------------------------------------------------------------------------------------
# Constat du 2026-10-02 : l'API Recherche d'entreprises (SIRENE) est injoignable depuis Render (erreurs de connexion) alors qu'elle
# répond depuis le poste de Mathéo. Deux mécanismes :
# - IMPORT : le worker importe `fichier_import` (comptes + échantillons mesurés sur le poste par scripts/compter_etablissements_local.py,
#   commité et déployé) au démarrage et à chaque passe, pour chaque paire (code NAF, département) dont la mesure du fichier est plus
#   récente que la dernière mesure en base. Additif et idempotent : rien n'est jamais supprimé ni importé deux fois.
# - RÉESSAI LENT : après un arrêt du disjoncteur SIRENE (3 échecs de suite), plus aucune requête pendant `reessai_lent_minutes`, puis une
#   seule paire sonde l'API ; la cartographie initiale ne consomme pas ses passes pour des paires que SIRENE ne peut pas mesurer.
etablissements:
  fichier_import: data/etablissements_import.json
  reessai_lent_minutes: 30

# V2.8b (décision de Mathéo du 2026-10-02) : en régime quotidien, les fiches des secteurs de la priorité `initiale.priorite` peuvent
# puiser, EN PLUS du plafond du jour, dans le reste de l'enveloppe initiale (RADAR_ENVELOPPE_INITIALE_EUR = 10 €, cumul étiquetage + fiches
# de tous les jours, jamais dépassé). Sans enveloppe posée ou une fois épuisée : aucun effet. `false` = comportement V2.8.
fiches_priorite_initiale_sur_enveloppe: true
