# Blueprint Render pour le radar d'opportunités. Déployé depuis son propre
# dépôt GitHub dédié (entreprisedaney33-rgb/radar-opportunites, privé) —
# JAMAIS depuis labo-ia directement : ce monorepo contient des données
# clients sensibles que Render n'a aucune raison de pouvoir lire. La copie
# de travail reste dans labo-ia/produits/radar-opportunites/ ; ce dossier-ci
# n'est qu'un miroir de déploiement, synchronisé par
# `scripts/deployer_vers_github.sh` (voir CLAUDE.md).
#
# Tarifs vérifiés sur render.com/pricing le 2026-09-25 (voir ARCHITECTURE.md) :
# Postgres basic_256mb = 6 $/mois ; Background Worker "starter" (0.5c-512mb)
# ~7 $/mois (tourne en continu, facturé comme un service toujours actif).
#
# Cron Job remplacé par un Background Worker le 25/09/2026 (soir) : un Cron
# Job a un plafond dur de 12h/exécution imposé par Render et n'est pas fait
# pour tourner en continu (demande explicite : "il ne faut jamais qu'il
# s'arrête") — voir ARCHITECTURE.md, section "Choix".

databases:
  - name: radar-opportunites-db
    databaseName: radar_opportunites
    plan: basic_256mb
    region: frankfurt   # aligné sur les autres bases du compte (n8n-db)

services:
  - type: worker
    name: radar-opportunites-worker
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m app.cli run-forever"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: radar-opportunites-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RADAR_PAUSE_ALL
        value: "0"

  # Optionnel — seulement si l'interface web est retenue en Phase 3 (voir
  # ARCHITECTURE.md, "Ce qui reste à décider"). Ne pas déployer sans en
  # avoir discuté : ressource payante supplémentaire (+7 $/mois, plan starter).
